apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-manager-api
  namespace: task-manager
  labels:
    app.kubernetes.io/name: task-manager-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: task-manager-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: task-manager-api
    spec:
      containers:
        - name: api
          image: harbor.example.com/task-manager/task-manager-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: task-manager-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
